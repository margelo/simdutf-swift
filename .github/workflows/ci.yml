name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check Swift toolchain
        run: swift --version
      - name: Test feature configurations
        run: python3 Scripts/test-features.py
      - name: Address sanitizer
        run: swift test --traits All --sanitize address

  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install test tools
        run: apt-get update && apt-get install -y python3 binutils
      - name: Test minimum Swift toolchain
        run: python3 Scripts/test-features.py
